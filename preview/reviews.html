<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отзывы наших пациентов</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://i.postimg.cc" crossorigin>
    <link rel="dns-prefetch" href="https://i.postimg.cc">
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/@fontsource/montserrat@5.0.19/index.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/montserrat@5.0.19/index.css"></noscript>
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Montserrat',system-ui,sans-serif;background:#BCAEA7;min-height:100vh;color:#5C3328;-webkit-font-smoothing:antialiased}

        /* === СЕКЦИЯ ОТЗЫВОВ — ровно 100vh на десктопе === */
        .reviews-section{
            background:#BCAEA7;
            min-height:100vh;
            height:100vh;
            display:flex;
            flex-direction:column;
            justify-content:center;
            padding:60px 20px 40px;
            position:relative;
            overflow:hidden;
        }
        .container{max-width:1280px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px}
        .section-title{text-align:center;font-size:2.6rem;font-weight:700;color:#5C3328;margin-bottom:12px;letter-spacing:-0.02em}
        .section-subtitle{text-align:center;font-size:1.05rem;color:rgba(92,51,40,0.6);margin-bottom:55px;font-weight:400}

        /* === КАРУСЕЛЬ === */
        .carousel-wrapper{position:relative;display:flex;align-items:center;gap:16px}
        .nav-arrow{flex-shrink:0;width:48px;height:48px;background:0 0;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s ease;user-select:none;padding:0;-webkit-tap-highlight-color:transparent}
        .nav-arrow:hover{transform:scale(1.15)}
        .nav-arrow:active{transform:scale(0.95)}
        .nav-arrow svg{width:40px;height:40px;stroke:#5C3328;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
        .carousel-viewport{flex:1;overflow:hidden;border-radius:20px;cursor:grab;will-change:transform}
        .carousel-viewport:active{cursor:grabbing}
        .carousel-track{display:flex;transition:transform .5s cubic-bezier(.25,.46,.45,.94);gap:30px;will-change:transform}
        .review-card{min-width:calc((100% - 60px)/3);background:#fff;border-radius:28px;padding:32px 26px 24px;box-shadow:0 8px 30px rgba(92,51,40,.1);display:flex;flex-direction:column;align-items:center;opacity:0;transform:translateY(40px);animation:cardIn .7s cubic-bezier(.22,1,.36,1) forwards}
        .review-card:nth-child(1){animation-delay:.1s}
        .review-card:nth-child(2){animation-delay:.25s}
        .review-card:nth-child(3){animation-delay:.4s}
        .review-card:nth-child(4){animation-delay:.55s}
        .review-card:nth-child(5){animation-delay:.7s}
        .review-card:nth-child(6){animation-delay:.85s}
        @keyframes cardIn{to{opacity:1;transform:translateY(0)}}
        .stars-container{display:flex;justify-content:center;gap:8px;margin-bottom:18px}
        .star{width:34px;height:34px;animation:starSpin 4s linear infinite}
        .star:nth-child(2){animation-delay:-.8s}
        .star:nth-child(3){animation-delay:-1.6s}
        .star:nth-child(4){animation-delay:-2.4s}
        .star:nth-child(5){animation-delay:-3.2s}
        @keyframes starSpin{to{transform:rotate(360deg)}}
        .star svg{width:100%;height:100%;filter:drop-shadow(0 2px 4px rgba(212,160,74,.4))}
        .review-text{font-size:.88rem;line-height:1.65;color:#5C3328;text-align:center;flex:1;margin-bottom:16px;font-weight:400}
        .view-original{display:block;text-align:center;color:#DB9844;font-size:.95rem;font-weight:600;text-decoration:none;padding-top:14px;border-top:1px solid #f0ebe5;width:100%;transition:color .2s,transform .2s;cursor:pointer}
        .view-original:hover{color:#c48535;transform:translateY(-1px)}
        .more-reviews-wrapper{text-align:center;margin-top:45px;flex-shrink:0}
        .more-reviews-btn{display:inline-block;padding:16px 48px;background:#5C3328;color:#fff;font-family:inherit;font-size:1rem;font-weight:600;border:none;border-radius:50px;cursor:pointer;transition:all .25s ease;box-shadow:0 6px 20px rgba(92,51,40,.25)}
        .more-reviews-btn:hover{background:#4a2820;transform:translateY(-2px);box-shadow:0 8px 25px rgba(92,51,40,.35)}
        .more-reviews-btn:active{transform:translateY(0)}

        /* === МОДАЛКА QR-КОДОВ === */
        .qr-overlay{
            position:fixed;inset:0;
            background:rgba(30,20,15,.85);
            backdrop-filter:blur(8px);
            display:flex;align-items:center;justify-content:center;
            z-index:1000;
            opacity:0;visibility:hidden;
            transition:opacity .35s,visibility .35s;
            padding:20px;
        }
        .qr-overlay.active{opacity:1;visibility:visible}
        .qr-modal{
            background:rgba(255,255,255,.15);
            backdrop-filter:blur(16px);
            -webkit-backdrop-filter:blur(16px);
            border:1px solid rgba(255,255,255,.25);
            border-radius:28px;
            padding:44px 40px 36px;
            max-width:780px;width:100%;
            position:relative;
            transform:scale(.92) translateY(15px);
            transition:transform .35s cubic-bezier(.34,1.56,.64,1);
            box-shadow:0 8px 32px rgba(0,0,0,.12),inset 0 0 0 1px rgba(255,255,255,.1);
        }
        .qr-overlay.active .qr-modal{transform:none}
        .qr-modal-close{
            position:absolute;top:16px;right:16px;
            width:44px;height:44px;border-radius:50%;
            background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);
            cursor:pointer;
            display:flex;align-items:center;justify-content:center;
            transition:transform .25s,background .25s;
            z-index:10;-webkit-tap-highlight-color:transparent;
        }
        .qr-modal-close:hover{background:rgba(255,255,255,.3)}
        .qr-modal-close:hover{transform:rotate(90deg) scale(1.1)}
        .qr-modal-close svg{width:20px;height:20px;stroke:#fff;stroke-width:2.5;fill:none;stroke-linecap:round}
        .qr-modal-title{text-align:center;font-size:1.35rem;font-weight:700;color:#fff;margin-bottom:32px;text-shadow:0 2px 8px rgba(0,0,0,.3)}
        .qr-grid{display:flex;justify-content:center;gap:28px;flex-wrap:wrap}
        .qr-card{
            background:rgba(255,255,255,.1);
            backdrop-filter:blur(8px);
            -webkit-backdrop-filter:blur(8px);
            border:1px solid rgba(255,255,255,.15);
            border-radius:22px;
            padding:22px 20px 18px;
            display:flex;flex-direction:column;align-items:center;gap:12px;
            min-width:180px;
            transition:transform .25s ease,background .25s ease;
        }
        .qr-card:hover{background:rgba(255,255,255,.2);transform:translateY(-5px)}
        .qr-link{color:inherit;text-decoration:none;cursor:pointer}
        .qr-link:visited{color:inherit}
        .qr-image-wrapper{
            width:150px;height:150px;border-radius:14px;overflow:hidden;
            background:rgba(255,255,255,.12);
            display:flex;align-items:center;justify-content:center;
            border:1px solid rgba(255,255,255,.1);
        }
        .qr-image{width:100%;height:100%;object-fit:contain}
        .qr-label{
            font-size:.88rem;font-weight:600;color:#fff;text-align:center;
            padding:6px 16px;border-radius:20px;
            background:rgba(255,255,255,.12);
            text-shadow:0 1px 4px rgba(0,0,0,.4);
        }

        /* === МОДАЛКА ОРИГИНАЛА ОТЗЫВА === */
        .modal-overlay{
            position:fixed;inset:0;
            background:rgba(30,20,15,.85);
            backdrop-filter:blur(8px);
            display:flex;align-items:center;justify-content:center;
            z-index:1001;
            opacity:0;visibility:hidden;
            transition:opacity .35s,visibility .35s;
            padding:20px;
        }
        .modal-overlay.active{opacity:1;visibility:visible}
        .modal-content{
            position:relative;max-width:600px;width:100%;max-height:90vh;
            background:#fff;border-radius:20px;overflow:hidden;
            transform:scale(.92) translateY(15px);
            transition:transform .35s cubic-bezier(.34,1.56,.64,1);
            box-shadow:0 20px 60px rgba(0,0,0,.4);
        }
        .modal-overlay.active .modal-content{transform:none}
        .modal-image{width:100%;height:auto;display:block;max-height:85vh;object-fit:contain}
        .modal-close{
            position:absolute;top:16px;right:16px;
            width:44px;height:44px;border-radius:50%;
            background:rgba(255,255,255,.95);border:none;cursor:pointer;
            display:flex;align-items:center;justify-content:center;
            transition:transform .25s;
            box-shadow:0 4px 12px rgba(0,0,0,.15);
            z-index:10;-webkit-tap-highlight-color:transparent;
        }
        .modal-close:hover{transform:rotate(90deg) scale(1.1)}
        .modal-close svg{width:20px;height:20px;stroke:#5C3328;stroke-width:2.5;fill:none;stroke-linecap:round}

        .decoration{position:absolute;border-radius:50%;opacity:.06;pointer-events:none;background:#5C3328}
        .decoration-1{width:400px;height:400px;top:-150px;right:-100px}
        .decoration-2{width:300px;height:300px;bottom:-100px;left:-80px}

        /* === 1440px === */
        @media(max-width:1440px){
            .section-title{font-size:2.3rem}
            .review-card{padding:28px 22px 20px}
        }
        /* === 1024px (планшет) === */
        @media(max-width:1024px){
            .review-card{min-width:calc((100% - 30px)/2)}
            .section-title{font-size:2rem}
            .carousel-wrapper{gap:12px}
        }
        /* === 768px === */
        @media(max-width:768px){
            .reviews-section{padding:40px 15px 30px;min-height:100vh;height:auto}
            .section-title{font-size:1.7rem}
            .section-subtitle{margin-bottom:35px}
            .review-card{min-width:100%;padding:24px 18px 18px}
            .star{width:28px;height:28px}
            .nav-arrow{width:36px;height:36px}
            .nav-arrow svg{width:30px;height:30px}
            .carousel-wrapper{gap:8px}
            .more-reviews-btn{padding:14px 36px;font-size:.95rem}
            .more-reviews-wrapper{margin-top:30px;padding-bottom:20px}
            .qr-modal{padding:32px 20px 28px;border-radius:22px}
            .qr-modal-title{font-size:1.15rem;margin-bottom:24px}
            .qr-grid{gap:16px}
            .qr-card{min-width:140px;padding:16px 14px 14px}
            .qr-image-wrapper{width:120px;height:120px}
        }
        /* === 480px (мобильный) === */
        @media(max-width:480px){
            .reviews-section{padding:30px 12px 20px;min-height:100vh;height:auto}
            .section-title{font-size:1.35rem}
            .section-subtitle{font-size:.9rem;margin-bottom:28px}
            .review-text{font-size:.82rem}
            .view-original{font-size:.88rem}
            .star{width:24px;height:24px}
            .stars-container{gap:5px;margin-bottom:14px}
            .review-card{padding:20px 14px 16px;border-radius:22px}
            .nav-arrow{width:30px;height:30px}
            .nav-arrow svg{width:24px;height:24px}
            .carousel-wrapper{gap:6px}
            .more-reviews-btn{padding:12px 28px;font-size:.88rem}
            .more-reviews-wrapper{margin-top:24px;padding-bottom:16px}
            .qr-modal{padding:24px 14px 20px;border-radius:18px}
            .qr-modal-title{font-size:1.05rem;margin-bottom:20px}
            .qr-grid{gap:12px}
            .qr-card{min-width:120px;padding:14px 10px 12px;border-radius:16px}
            .qr-image-wrapper{width:100px;height:100px}
            .qr-label{font-size:.78rem;padding:5px 12px}
            .decoration-1{width:250px;height:250px;top:-100px;right:-60px}
            .decoration-2{width:200px;height:200px;bottom:-70px;left:-50px}
        }

        /* === 1920x1080 (десктоп) === */
        @media(min-width:1441px){
            .reviews-section{padding:70px 40px 50px}
            .section-title{font-size:2.8rem}
            .section-subtitle{font-size:1.1rem;margin-bottom:60px}
            .review-card{padding:34px 28px 26px}
            .review-text{font-size:.92rem}
            .qr-modal{padding:52px 48px 44px;max-width:840px}
        }
    </style>
</head>
<body>
    <section class="reviews-section">
        <div class="decoration decoration-1"></div>
        <div class="decoration decoration-2"></div>
        <div class="container">
            <h2 class="section-title">Отзывы наших пациентов</h2>
            <p class="section-subtitle">Нам доверяют своё здоровье и улыбку</p>

            <div class="carousel-wrapper">
                <button class="nav-arrow prev-arrow" id="prevBtn" aria-label="Предыдущие">
                    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/><polyline points="9 18 3 12 9 6" transform="translate(6,0)"/></svg>
                </button>

                <div class="carousel-viewport" id="carouselViewport">
                    <div class="carousel-track" id="carouselTrack">
                        <div style="text-align:center;color:#5C3328;padding:40px;width:100%">Загрузка отзывов...</div>
                    </div>
                </div>

                <button class="nav-arrow next-arrow" id="nextBtn" aria-label="Следующие">
                    <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/><polyline points="15 18 21 12 15 6" transform="translate(-6,0)"/></svg>
                </button>
            </div>

            <div class="more-reviews-wrapper">
                <button class="more-reviews-btn" id="moreReviewsBtn">Больше отзывов</button>
            </div>
        </div>
    </section>

    <!-- Модалка QR-кодов -->
    <div class="qr-overlay" id="qrOverlay">
        <div class="qr-modal">
            <button class="qr-modal-close" id="qrClose" aria-label="Закрыть">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
            <h3 class="qr-modal-title">Найдите нас на площадках</h3>
            <div class="qr-grid">
                <a href="https://2gis.ru/tula/firm/70000001112917766" target="_blank" rel="noopener noreferrer" class="qr-card qr-link">
                    <div class="qr-image-wrapper">
                        <img class="qr-image" src="https://i.postimg.cc/VkssbSLd/2gis-qr.png" alt="2GIS QR" loading="lazy" decoding="async" width="150" height="150">
                    </div>
                    <span class="qr-label">2GIS</span>
                </a>
                <a href="https://yandex.ru/maps/org/amber/196183565720/?ll=37.564231%2C54.168193&z=16" target="_blank" rel="noopener noreferrer" class="qr-card qr-link">
                    <div class="qr-image-wrapper">
                        <img class="qr-image" src="https://i.postimg.cc/5N4yVFVs/andeks.jpg" alt="Яндекс Карты QR" loading="lazy" decoding="async" width="150" height="150">
                    </div>
                    <span class="qr-label">Яндекс Карты</span>
                </a>
                <a href="https://prodoctorov.ru/tula/lpu/114160-amber" target="_blank" rel="noopener noreferrer" class="qr-card qr-link">
                    <div class="qr-image-wrapper">
                        <img class="qr-image" src="https://i.postimg.cc/CLh5gfgJ/prodoktorv.jpg" alt="ПроДокторов QR" loading="lazy" decoding="async" width="150" height="150">
                    </div>
                    <span class="qr-label">ПроДокторов</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Модалка оригинала отзыва -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <button class="modal-close" id="modalClose" aria-label="Закрыть">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
            <img class="modal-image" id="modalImage" src="" alt="Оригинал отзыва">
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
    (function(){
        var SUPABASE_URL='https://pjujhrfkykxgzcexyyti.supabase.co';
        var SUPABASE_KEY='sb_publishable_UZtIlbYBisAt6BIWSkiMqg_y09ZDEdw';
        var STORAGE_BASE=SUPABASE_URL+'/storage/v1/object/public/testimonials/';

        var track=document.getElementById('carouselTrack'),
            viewport=document.getElementById('carouselViewport'),
            prevBtn=document.getElementById('prevBtn'),
            nextBtn=document.getElementById('nextBtn'),
            modalOverlay=document.getElementById('modalOverlay'),
            modalImage=document.getElementById('modalImage'),
            modalClose=document.getElementById('modalClose'),
            moreBtn=document.getElementById('moreReviewsBtn'),
            qrOverlay=document.getElementById('qrOverlay'),
            qrClose=document.getElementById('qrClose');

        var testimonials=[];
        var page=0,perView=3,resizeTimer;
        var GAP=30;

        function calcPerView(){
            var w=window.innerWidth;
            return w<=768?1:w<=1024?2:3;
        }

        function escapeHtml(text){
            var d=document.createElement('div');
            d.appendChild(document.createTextNode(text));
            return d.innerHTML;
        }

        function buildStars(rating){
            var n=Math.min(Math.max(parseInt(rating)||5,1),5);
            var h='';
            for(var i=0;i<n;i++){
                h+='<div class="star"><svg viewBox="0 0 24 24" fill="#d4a04a"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></div>';
            }
            return h;
        }

        function buildCard(t,idx){
            var html='<div class="review-card">';
            html+='<div class="stars-container">'+buildStars(t.rating)+'</div>';
            html+='<p class="review-text">'+escapeHtml(t.content)+'</p>';
            if(t.screenshot_path){
                html+='<a class="view-original" data-index="'+idx+'">Смотреть оригинал</a>';
            }
            html+='</div>';
            return html;
        }

        function renderCards(){
            var html='';
            for(var i=0;i<testimonials.length;i++){
                html+=buildCard(testimonials[i],i);
            }
            track.innerHTML=html;
            page=0;
            layout();
        }

        function layout(){
            var cards=track.children;
            if(!cards.length)return;
            perView=calcPerView();
            var pages=Math.ceil(cards.length/perView);
            if(page>=pages)page=Math.max(pages-1,0);
            var vw=viewport.offsetWidth;
            var cw=(vw-GAP*(perView-1))/perView;
            for(var i=0;i<cards.length;i++)cards[i].style.minWidth=cw+'px';
            move();
        }

        function move(){
            var cards=track.children;
            if(!cards.length)return;
            var cw=cards[0].offsetWidth;
            track.style.transform='translateX(-'+(page*perView*(cw+GAP))+'px)';
        }

        function go(p){
            var cards=track.children;
            var pages=Math.ceil(cards.length/perView);
            if(pages<=0)return;
            page=(p<0?pages-1:p>=pages?0:p);
            move();
        }

        prevBtn.onclick=function(){go(page-1)};
        nextBtn.onclick=function(){go(page+1)};

        /* --- Модалка отзыва --- */
        function openModal(idx){
            if(idx<0||idx>=testimonials.length)return;
            var t=testimonials[idx];
            if(!t.screenshot_path)return;
            modalImage.src=STORAGE_BASE+t.screenshot_path;
            modalOverlay.classList.add('active');
            document.body.style.overflow='hidden';
        }
        function closeModal(){
            modalOverlay.classList.remove('active');
            document.body.style.overflow='';
            setTimeout(function(){modalImage.src=''},350);
        }

        track.addEventListener('click',function(e){
            var target=e.target;
            while(target&&target!==track){
                if(target.classList&&target.classList.contains('view-original')){
                    e.preventDefault();
                    var idx=parseInt(target.getAttribute('data-index'),10);
                    openModal(idx);
                    return;
                }
                target=target.parentNode;
            }
        });

        modalClose.onclick=closeModal;
        modalOverlay.addEventListener('click',function(e){
            if(e.target===modalOverlay)closeModal();
        });

        /* --- Модалка QR-кодов --- */
        function openQr(){qrOverlay.classList.add('active');document.body.style.overflow='hidden'}
        function closeQr(){qrOverlay.classList.remove('active');document.body.style.overflow=''}

        moreBtn.onclick=openQr;
        qrClose.onclick=closeQr;
        qrOverlay.addEventListener('click',function(e){
            if(e.target===qrOverlay)closeQr();
        });

        /* --- Клавиатура --- */
        document.addEventListener('keydown',function(e){
            if(e.key==='Escape'){
                if(modalOverlay.classList.contains('active'))closeModal();
                else if(qrOverlay.classList.contains('active'))closeQr();
                return;
            }
            if(!qrOverlay.classList.contains('active')&&!modalOverlay.classList.contains('active')){
                if(e.key==='ArrowLeft')go(page-1);
                else if(e.key==='ArrowRight')go(page+1);
            }
        });

        /* --- Свайп --- */
        var sx=0,sy=0;
        viewport.addEventListener('touchstart',function(e){sx=e.touches[0].screenX;sy=e.touches[0].screenY},{passive:true});
        viewport.addEventListener('touchend',function(e){
            var dx=sx-e.changedTouches[0].screenX,dy=sy-e.changedTouches[0].screenY;
            if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>40)go(dx>0?page+1:page-1);
        },{passive:true});

        window.addEventListener('resize',function(){clearTimeout(resizeTimer);resizeTimer=setTimeout(layout,150)});

        /* --- Загрузка из Supabase --- */
        async function fetchTestimonials(){
            try{
                var client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
                var result=await client
                    .from('testimonials')
                    .select('*')
                    .eq('published',true)
                    .order('order_index',{ascending:true});

                if(result.error){
                    console.error('Supabase error:',result.error);
                    return;
                }

                testimonials=result.data||[];
                if(testimonials.length===0){
                    track.innerHTML='<div style="text-align:center;color:#5C3328;padding:40px;width:100%">Отзывы загружаются...</div>';
                    return;
                }

                renderCards();
            }catch(err){
                console.error('Fetch error:',err);
            }
        }

        fetchTestimonials();
    })();
    </script>
</body>
</html>
