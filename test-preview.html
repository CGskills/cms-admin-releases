<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>srcdoc Test</title>
</head>
<body>
<h1>Testing iframe srcdoc</h1>

<h2>Test 1: Simple HTML</h2>
<iframe sandbox="allow-scripts" srcdoc="<h1>Hello World</h1>" style="width:100%;height:100px;border:1px solid #ccc;"></iframe>

<h2>Test 2: With inline script</h2>
<iframe sandbox="allow-scripts" id="test2" style="width:100%;height:100px;border:1px solid #ccc;"></iframe>

<h2>Test 3: Complex HTML (like CodePreview)</h2>
<iframe sandbox="allow-scripts" id="test3" style="width:100%;height:200px;border:1px solid #ccc;"></iframe>

<script>
// Test 2: assign via JS
const iframe2 = document.getElementById('test2');
iframe2.srcdoc = '<h1>Assigned via JS</h1><script>console.log("Test 2 loaded")<\/script>';

// Test 3: mimic CodePreview logic
const iframe3 = document.getElementById('test3');
const fullHtml = `<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
.tilda-preview-block { font-family: Arial, sans-serif; line-height: 1.5; }
.tilda-preview-block h1 { color: #DB9844; }
</style>
</head>
<body style="margin:0;padding:0;overflow-x:hidden;">
<div class="tilda-preview-block">
<h1>Complex Preview Test</h1>
<p>This mimics the CodePreview component structure.</p>
</div>
<script>
(function() {
  try {
    console.log('Test 3 JS executed');
  } catch(e) {
    console.error('Preview JS error:', e);
  }
})();
<\/script>
</body>
</html>`;
iframe3.srcdoc = fullHtml;

console.log('All tests initialized');
</script>
</body>
</html>
