<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Import Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      max-width: 1200px;
      margin: 40px auto;
      padding: 20px;
      background: #0F172A;
      color: #F8FAFC;
    }
    h1 {
      color: #38BDF8;
      margin-bottom: 20px;
    }
    .info {
      background: #1E293B;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid #334155;
    }
    button {
      background: #F97316;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 20px;
    }
    button:hover {
      background: #EA580C;
    }
    button:disabled {
      background: #64748B;
      cursor: not-allowed;
    }
    #output {
      background: #0B0E14;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #334155;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      max-height: 600px;
      overflow-y: auto;
    }
    .loading {
      color: #38BDF8;
    }
    .success {
      color: #4FD1C5;
    }
    .error {
      color: #F87171;
    }
    .warning {
      color: #FBBF24;
    }
  </style>
</head>
<body>
  <h1>Code Blocks Import Test</h1>
  
  <div class="info">
    <p><strong>Instructions:</strong></p>
    <ol>
      <li>Make sure you are signed in as admin</li>
      <li>Click "Run Import Test" button</li>
      <li>View detailed results in the output panel</li>
    </ol>
  </div>

  <button id="runTest" onclick="runImportTest()">Run Import Test</button>
  
  <div id="output"></div>

  <script src="/test-import.js"></script>
</body>
</html>
